// spot@private.account.v3.api.pb
// Modified by StockSharp: added csharp_namespace for generated C# types.

syntax = "proto3";

option csharp_namespace = "StockSharp.Mexc.Native.Protobuf";
option java_package = "com.mxc.push.common.protobuf";
option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "PrivateAccountV3ApiProto";

message PrivateAccountV3Api {
  string vcoinName = 1;
  string coinId = 2;
  string balanceAmount = 3;
  string balanceAmountChange = 4;
  string frozenAmount = 5;
  string frozenAmountChange = 6;
  string type = 7;
  int64 time = 8;
}

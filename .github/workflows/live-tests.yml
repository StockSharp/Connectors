name: Live tests

# The checks that talk to real venues and archives. Kept off every push: they depend on third
# party uptime and rate limits, and several venues refuse cloud addresses. Run on demand to
# investigate venue changes independently of the regular build.
# The keys come from the repository's secrets; a check whose key is missing reports itself
# inconclusive and names the variable.
on:
  workflow_dispatch:
    inputs:
      include_regional_tests:
        description: 'Include Binance, Bybit and Tokocrypto checks that require access from a permitted region'
        type: boolean
        default: false
      include_keyless_cmc_tests:
        description: 'Use CoinMarketCap anonymous quota when COINMARKETCAP_TOKEN is unavailable'
        type: boolean
        default: false
      include_moex_dividends_tests:
        description: 'Include MOEX dividend-history checks (requires an ISS dividend data service)'
        type: boolean
        default: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      STOCKSHARP_LIVE_TESTS: '1'
      STOCKSHARP_LIVE_REGIONAL_TESTS: ${{ inputs.include_regional_tests && '1' || '0' }}
      COINMARKETCAP_TOKEN: ${{ secrets.COINMARKETCAP_TOKEN }}
      COINMARKETCAP_KEYLESS_TESTS: ${{ inputs.include_keyless_cmc_tests && '1' || '0' }}
      STOCKSHARP_LIVE_MOEX_DIVIDENDS_TESTS: ${{ inputs.include_moex_dividends_tests && '1' || '0' }}
      ALPHAVANTAGE_TOKEN: ${{ secrets.ALPHAVANTAGE_TOKEN }}
      POLYGON_TOKEN: ${{ secrets.POLYGON_TOKEN }}
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      STOCKSHARP_METAAPI_TOKEN: ${{ secrets.STOCKSHARP_METAAPI_TOKEN }}
      STOCKSHARP_METAAPI_ACCOUNT: ${{ secrets.STOCKSHARP_METAAPI_ACCOUNT }}
      STOCKSHARP_STOCKSTRADER_TOKEN: ${{ secrets.STOCKSHARP_STOCKSTRADER_TOKEN }}

    steps:
      # The connector projects import "../StockSharp (GitHub)/props/common_target_net.props", so both
      # repos sit side by side, the StockSharp folder named exactly "StockSharp (GitHub)".
      - name: Checkout Connectors
        uses: actions/checkout@v7
        with:
          path: Connectors

      - name: Checkout StockSharp
        uses: actions/checkout@v7
        with:
          repository: StockSharp/StockSharp
          path: 'StockSharp (GitHub)'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Build
        working-directory: Connectors
        run: dotnet build Connectors.slnx --configuration Release

      # One at a time: run side by side, the venues answer a burst from one address with timeouts
      # and rate limits instead of data.
      - name: Run live tests
        working-directory: Connectors
        run: >
          dotnet test Tests/Tests.csproj
          --no-build
          --configuration Release
          --filter "TestCategory=Integration"
          --logger "trx;LogFileName=live-tests.trx"
          --results-directory TestResults
          --blame-hang-timeout 3m
          -- MSTest.Parallelize.Workers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-results
          path: Connectors/TestResults/*.trx
          if-no-files-found: warn

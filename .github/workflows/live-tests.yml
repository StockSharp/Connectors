name: Live tests

# Checks that talk to real venues and archives. Runs after successful push checks in
# tests.yml or independently through workflow_dispatch.
# The keys come from the repository's secrets; a check whose key is missing reports itself
# inconclusive and names the variable.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      include_regional_tests:
        description: 'Include checks for restricted networks and unreliable public demo or registry endpoints'
        type: boolean
        default: false
      include_coinmetro_tests:
        description: 'Include Coinmetro market-data checks when its public API is available'
        type: boolean
        default: false
      include_gopax_tests:
        description: 'Include GOPAX catalog, Level1, order book and candle checks when trading resumes'
        type: boolean
        default: false
      include_keyless_cmc_tests:
        description: 'Use CoinMarketCap anonymous quota when COINMARKETCAP_TOKEN is unavailable'
        type: boolean
        default: false
      include_moex_dividends_tests:
        description: 'Include MOEX dividend-history checks (requires an ISS dividend data service)'
        type: boolean
        default: false
      include_bydfi_tests:
        description: 'Include BYDFi futures checks (requires an accessible futures API)'
        type: boolean
        default: false
      include_gmtrade_tests:
        description: 'Include GMTrade checks (requires keeper and WebSocket API quota)'
        type: boolean
        default: false
      include_reuters_rss_tests:
        description: 'Include Thomson Reuters RSS (requires programmatic access from this runner)'
        type: boolean
        default: false
      include_btcturk_history_tests:
        description: 'Include BtcTurk candles when its public graph API supplies history'
        type: boolean
        default: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      STOCKSHARP_LIVE_TESTS: '1'
      STOCKSHARP_LIVE_REGIONAL_TESTS: ${{ inputs.include_regional_tests && '1' || '0' }}
      STOCKSHARP_LIVE_COINMETRO_TESTS: ${{ inputs.include_coinmetro_tests && '1' || '0' }}
      STOCKSHARP_LIVE_GOPAX_TESTS: ${{ inputs.include_gopax_tests && '1' || '0' }}
      COINMARKETCAP_TOKEN: ${{ secrets.COINMARKETCAP_TOKEN }}
      COINMARKETCAP_KEYLESS_TESTS: ${{ inputs.include_keyless_cmc_tests && '1' || '0' }}
      STOCKSHARP_LIVE_MOEX_DIVIDENDS_TESTS: ${{ inputs.include_moex_dividends_tests && '1' || '0' }}
      STOCKSHARP_LIVE_BYDFI_TESTS: ${{ inputs.include_bydfi_tests && '1' || '0' }}
      STOCKSHARP_LIVE_GMTRADE_TESTS: ${{ inputs.include_gmtrade_tests && '1' || '0' }}
      STOCKSHARP_LIVE_REUTERS_RSS_TESTS: ${{ inputs.include_reuters_rss_tests && '1' || '0' }}
      STOCKSHARP_LIVE_BTCTURK_HISTORY_TESTS: ${{ inputs.include_btcturk_history_tests && '1' || '0' }}
      ALPHAVANTAGE_TOKEN: ${{ secrets.ALPHAVANTAGE_TOKEN }}
      POLYGON_TOKEN: ${{ secrets.POLYGON_TOKEN }}
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      STOCKSHARP_METAAPI_TOKEN: ${{ secrets.STOCKSHARP_METAAPI_TOKEN }}
      STOCKSHARP_METAAPI_ACCOUNT: ${{ secrets.STOCKSHARP_METAAPI_ACCOUNT }}
      STOCKSHARP_STOCKSTRADER_TOKEN: ${{ secrets.STOCKSHARP_STOCKSTRADER_TOKEN }}

    steps:
      # The connector projects import "../StockSharp (GitHub)/props/common_target_net.props", so both
      # repos sit side by side, the StockSharp folder named exactly "StockSharp (GitHub)".
      - name: Checkout Connectors
        uses: actions/checkout@v7
        with:
          path: Connectors

      - name: Checkout StockSharp
        uses: actions/checkout@v7
        with:
          repository: StockSharp/StockSharp
          path: 'StockSharp (GitHub)'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Build
        working-directory: Connectors
        run: dotnet build Connectors.slnx --configuration Release

      # One at a time: run side by side, the venues answer a burst from one address with timeouts
      # and rate limits instead of data.
      - name: Run live tests
        working-directory: Connectors
        run: |
          live_test_filter='TestCategory=Integration'
          if [ "$STOCKSHARP_LIVE_REGIONAL_TESTS" != '1' ]; then
            # BitoPro public REST returns HTTP 403 from the hosted runner.
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.BitoProTests.Securities'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.BitoProTests.Candles'

            # Mercado Bitcoin public API returns HTTP 403 from the hosted runner.
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.MercadoBitcoinMarketDataTests.Securities'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.MercadoBitcoinMarketDataTests.Level1'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.MercadoBitcoinMarketDataTests.OrderBook'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.MercadoBitcoinMarketDataTests.Ticks'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.MercadoBitcoinMarketDataTests.Candles'
          fi

          if [ "$STOCKSHARP_LIVE_COINMETRO_TESTS" != '1' ]; then
            # Coinmetro public API returns HTTP 525 during the exchange outage.
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.CoinmetroTests.Securities'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.CoinmetroTests.Level1'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.CoinmetroTests.OrderBook'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.CoinmetroTests.Ticks'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.CoinmetroTests.Candles'
          fi

          if [ "$STOCKSHARP_LIVE_GOPAX_TESTS" != '1' ]; then
            # GOPAX suspended trading. Its public catalog is empty and these endpoints return HTTP 404.
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.GopaxMarketDataTests.Securities'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.GopaxMarketDataTests.Level1'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.GopaxMarketDataTests.OrderBook'
            live_test_filter+='&FullyQualifiedName!=StockSharp.Connectors.Tests.GopaxMarketDataTests.Candles'
          fi

          dotnet test Tests/Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "$live_test_filter" \
            --logger "trx;LogFileName=live-tests.trx" \
            --results-directory TestResults \
            --blame-hang-timeout 3m \
            -- MSTest.Parallelize.Workers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-results
          path: Connectors/TestResults/*.trx
          if-no-files-found: warn
